# Phase 22 -- idf weighting on the fine-tuned LI model | split: random
# PURE IDF: every query token weighted by its corpus IDF (rare symbols count more than
# common ones). Data-derived, replaces the hand-set flat 4.0. Scale-invariant.
# Eval-ONLY: SAME index.dir as the FT model -> reuses the cached premise index (weighting is
# query-side arithmetic), so this is a fast job. Compare against late_interaction_ft_random_weighted
# (the flat w=4.0) via scripts/significance.py.
name: late_interaction_ft_random_idf
retriever: late_interaction

model:
  hf_id: lightonai/GTE-ModernColBERT-v1
  path: ${SCRATCH}/prooflens/checkpoints/li_ft_random_bm25
  loader: pylate.models.ColBERT
  query_length: 384
  document_length: 300
  batch_size: 32

index:
  dir: ${SCRATCH}/prooflens/indices/li_ft_random             # SAME as the FT index -> reuse (eval-only)
  backend: exact-maxsim

data:
  corpus_path: ${DATA_ROOT}/corpus.jsonl
  splits_dir: ${DATA_ROOT}/
  split_file: test.json
  accessibility: computed

symbol_weighting:
  enabled: true
  mode: idf                 # Phase 22: weight each token by corpus IDF (not a flat constant)
  idf_path: ${SCRATCH}/prooflens/indices/token_idf.json   # built by scripts/build_token_idf.py
  idf_fallback: 1.0         # neutral weight for special / unseen tokens

eval:
  k_list: [1, 10]
  retrieve_k: 100
  splits: [random]

seed: 42
