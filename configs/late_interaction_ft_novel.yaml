# Fine-tuned ProofLens-LI evaluated on the NOVEL_PREMISES split — weighting OFF.
# Split-matched: this checkpoint was trained on novel_premises/train and is evaluated ONLY on
# novel_premises/test (leak-free generalisation, unlike the public dense-novel number). Same frozen
# harness; query_length=384 (Phase-11 locked), fresh index for the FT novel model.
name: late_interaction_ft_novel
retriever: late_interaction

model:
  hf_id: lightonai/GTE-ModernColBERT-v1
  path: ${SCRATCH}/prooflens/checkpoints/li_ft_novel_bm25     # the novel-trained checkpoint
  loader: pylate.models.ColBERT
  query_length: 384
  document_length: 300
  batch_size: 32

index:
  dir: ${SCRATCH}/prooflens/indices/li_ft_novel              # fresh: re-encode premises with the novel FT model
  backend: exact-maxsim

data:
  corpus_path: ${DATA_ROOT}/corpus.jsonl
  splits_dir: ${DATA_ROOT}/
  split_file: test.json
  accessibility: computed

symbol_weighting:
  enabled: false

eval:
  k_list: [1, 10]
  retrieve_k: 100
  splits: [novel_premises]     # split-matched: novel-trained checkpoint -> novel/test only

seed: 42
