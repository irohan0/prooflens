# Eval the matched single-vector control on NOVEL (split-matched), lr=3e-6 checkpoint. Same frozen
# dense harness / encoder / premise text as every other run; only model.path / index.dir / split
# differ. Its R@10 vs FT-SV-random (32.0) gives the single-vector generalisation gap — the airtight
# baseline the FT-LI gap (27.66 -> 28.46, flat) is compared against. Fresh index dir (new weights).
name: dense_sv_ft_novel_lr3e6
retriever: dense

model:
  hf_id: Alibaba-NLP/gte-modernbert-base
  path: ${SCRATCH}/prooflens/checkpoints/sv_ft_novel_lr3e6
  encoder: sentence_transformer
  premise_text: full_name_code
  max_length: 512
  batch_size: 64

index:
  dir: ${SCRATCH}/prooflens/indices/sv_ft_novel_lr3e6

data:
  corpus_path: ${DATA_ROOT}/corpus.jsonl
  splits_dir: ${DATA_ROOT}/
  split_file: test.json
  accessibility: computed

eval:
  k_list: [1, 10]
  retrieve_k: 100
  splits: [novel_premises]

seed: 42
