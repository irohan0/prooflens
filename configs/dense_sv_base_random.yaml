# DIAGNOSTIC (Phase 15) — evaluate the OFF-THE-SHELF gte-modernbert-base (NO fine-tuning) on random.
# Purpose: disambiguate why FT-SV scored implausibly low (5% R@10, below untrained BM25/LI).
#   - if this untrained base scores WELL (double digits) and FT-SV scored 5% -> fine-tuning DAMAGED
#     the model (a training bug: LR/precision/collapse).
#   - if this untrained base ALSO scores ~5% -> a shared EVAL/inference issue (e.g. the model needs a
#     query/document prefix, or a pooling/normalisation mismatch) -> not a training problem.
# Same frozen dense harness, same encoder + premise text as the FT-SV eval — only model.path differs
# (the staged base, not the checkpoint). This untrained single-vector number is also a legitimate
# leak-free baseline in its own right (like off-the-shelf LI).
name: dense_sv_base_random
retriever: dense

model:
  hf_id: Alibaba-NLP/gte-modernbert-base
  path: ${MODELS_DIR}/Alibaba-NLP__gte-modernbert-base     # the UNTRAINED base model
  encoder: sentence_transformer
  premise_text: full_name_code
  max_length: 512
  batch_size: 64

index:
  dir: ${SCRATCH}/prooflens/indices/sv_base

data:
  corpus_path: ${DATA_ROOT}/corpus.jsonl
  splits_dir: ${DATA_ROOT}/
  split_file: test.json
  accessibility: computed

eval:
  k_list: [1, 10]
  retrieve_k: 100
  splits: [random]

seed: 42
