# Eval the LR-sweep SV checkpoint (lr=3.0e-6) on random — same frozen dense harness as every other
# run; only model.path / index.dir differ. Winner (highest R@10, and must BEAT the untrained base
# 11.41) is the final random control.
name: dense_sv_ft_random_lr3e6
retriever: dense

model:
  hf_id: Alibaba-NLP/gte-modernbert-base
  path: ${SCRATCH}/prooflens/checkpoints/sv_ft_random_lr3e6
  encoder: sentence_transformer
  premise_text: full_name_code
  max_length: 512
  batch_size: 64

index:
  dir: ${SCRATCH}/prooflens/indices/sv_ft_random_lr3e6

data:
  corpus_path: ${DATA_ROOT}/corpus.jsonl
  splits_dir: ${DATA_ROOT}/
  split_file: test.json
  accessibility: computed

eval:
  k_list: [1, 10]
  retrieve_k: 100
  splits: [random]

seed: 42
