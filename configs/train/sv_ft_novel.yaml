# Matched single-vector control — NOVEL_PREMISES split (Phase 15). Same recipe as sv_ft_random,
# novel triplets. Split-matched: evaluated only on novel_premises/test. The random vs novel SV gap
# (measured in OUR harness) is the airtight baseline the FT-LI gap is compared against.
name: sv_ft_novel

base_model:
  hf_id: Alibaba-NLP/gte-modernbert-base
  path: ${MODELS_DIR}/Alibaba-NLP__gte-modernbert-base
  max_length: 512

train:
  pairs: ${SCRATCH}/prooflens/pairs/novel_premises_bm25_train.jsonl
  val_pairs: ${SCRATCH}/prooflens/pairs/novel_premises_bm25_val.jsonl
  epochs: 1
  batch_size: 32
  lr: 2.0e-5
  warmup_ratio: 0.05
  bf16: true
  seed: 42
  logging_steps: 500
  eval_steps: 5000
  save_steps: 5000

output_dir: ${SCRATCH}/prooflens/checkpoints/sv_ft_novel
