# Fine-tuned ProofLens-LI on RANDOM — symbol weighting ON (Phase 14 / the trained-model ablation).
# Identical to late_interaction_ft_random.yaml EXCEPT symbol_weighting.enabled: true and a distinct
# name. SAME index.dir as OFF -> reuses the cached FT premise index (weighting is query-side only),
# so the ON run is a fast eval-only job. symbol_weight = 4.0 (Phase-11 sweep best); it will itself be
# re-checked on the trained model, since fine-tuning shifts the embeddings.
name: late_interaction_ft_random_weighted
retriever: late_interaction

model:
  hf_id: lightonai/GTE-ModernColBERT-v1
  path: ${SCRATCH}/prooflens/checkpoints/li_ft_random_bm25
  loader: pylate.models.ColBERT
  query_length: 384
  document_length: 300
  batch_size: 32

index:
  dir: ${SCRATCH}/prooflens/indices/li_ft_random             # SAME as OFF -> reuse the cached FT index
  backend: exact-maxsim

data:
  corpus_path: ${DATA_ROOT}/corpus.jsonl
  splits_dir: ${DATA_ROOT}/
  split_file: test.json
  accessibility: computed

symbol_weighting:
  enabled: true             # ON
  symbol_weight: 4.0        # Phase-11 sweep best (was 2.0); re-tune on the trained model in Phase 17
  default_weight: 1.0

eval:
  k_list: [1, 10]
  retrieve_k: 100
  splits: [random]

seed: 42
