# Dense single-vector — official ReProver ByT5-small retriever checkpoint (no training).
# The harness-correctness calibration anchor (docs/EVALUATION.md §3). Every encoding choice below
# is replicated verbatim from ReProver's source (retrieval/model.py + common.py); see dense.py.
name: dense_reprover
retriever: dense

model:
  hf_id: kaiyuy/leandojo-lean4-retriever-byt5-small   # CONFIRMED (Phase 2): exists on HF
  # Offline path on the cluster: download_data.py stages the snapshot here (id '/' -> '__').
  # from_pretrained() reads this dir directly under HF_HUB_OFFLINE=1. Falls back to hf_id if unset.
  path: ${MODELS_DIR}/kaiyuy__leandojo-lean4-retriever-byt5-small
  loader: AutoModelForTextEncoding    # ByT5 -> T5 encoder; pool its last_hidden_state (ReProver)
  pooling: masked_mean                # (hidden * mask).sum(1) / mask.sum(1)   -- ReProver _encode
  similarity: cosine                  # F.normalize then dot product == cosine  -- ReProver _encode
  max_length: 1024                    # ReProver retrieval/confs/*lean4*.yaml; log truncation rate
  batch_size: 64                      # inference batch (affects speed only, not the metric)

data:
  # DATA_ROOT = .../leandojo_benchmark_4 (confirmed schema, Phase 2)
  corpus_path: ${DATA_ROOT}/corpus.jsonl
  splits_dir: ${DATA_ROOT}/
  split_file: test.json
  accessibility: computed   # from corpus imports (transitive) + positions; not shipped (Phase 2)

index:
  dir: ${SCRATCH}/prooflens/indices/dense_reprover
  # 'exact' (not ANN): premise vectors held in memory, scored by exact matmul over the accessible
  # subset. This matches ReProver's get_nearest_premises (full dot-product then accessible filter)
  # and introduces no recall error of its own — required for a calibration anchor. See dense.py.
  backend: exact-cosine

eval:
  k_list: [1, 10]
  retrieve_k: 100
  splits: [random, novel_premises]

seed: 42
