# Phase 22 -- symbol_idf weighting on the fine-tuned LI model | split: novel_premises
# SYMBOL-GATED IDF: symbol tokens weighted by their IDF (instead of a flat 4.0),
# non-symbol tokens kept at 1.0 -- the direct principled upgrade of Phase 9's scheme.
# Eval-ONLY: SAME index.dir as the FT model -> reuses the cached premise index (weighting is
# query-side arithmetic), so this is a fast job. Compare against late_interaction_ft_novel_weighted
# (the flat w=4.0) via scripts/significance.py.
name: late_interaction_ft_novel_symbolidf
retriever: late_interaction

model:
  hf_id: lightonai/GTE-ModernColBERT-v1
  path: ${SCRATCH}/prooflens/checkpoints/li_ft_novel_bm25
  loader: pylate.models.ColBERT
  query_length: 384
  document_length: 300
  batch_size: 32

index:
  dir: ${SCRATCH}/prooflens/indices/li_ft_novel             # SAME as the FT index -> reuse (eval-only)
  backend: exact-maxsim

data:
  corpus_path: ${DATA_ROOT}/corpus.jsonl
  splits_dir: ${DATA_ROOT}/
  split_file: test.json
  accessibility: computed

symbol_weighting:
  enabled: true
  mode: symbol_idf          # Phase 22: symbols weighted by IDF, filler at default
  idf_path: ${SCRATCH}/prooflens/indices/token_idf.json
  idf_fallback: 1.0
  default_weight: 1.0
  idf_scale: 1.0            # optional multiplier on symbol IDF weights

eval:
  k_list: [1, 10]
  retrieve_k: 100
  splits: [novel_premises]

seed: 42
